[project]
name = "kokoro-onnx"
version = "0.6.1"
description = "TTS with kokoro and onnx runtime"
readme = "README.md"
authors = [
    { name = "thewh1teagle", email = "61390950+thewh1teagle@users.noreply.github.com" },
]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "onnxruntime>=1.30.0,<2",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4.0",
    "numpy>=2.5.3,<3",
]

[project.urls]
Homepage = "https://github.com/dayour/kokoro-onnx"
Repository = "https://github.com/dayour/kokoro-onnx"
Issues = "https://github.com/dayour/kokoro-onnx/issues"


[project.optional-dependencies]
# Windows/Linux GPU feature
# Install with kokoro-onnx[gpu]
gpu = [
    # onnxruntime-gpu is not available on Linux ARM or macOS
    "onnxruntime-gpu[cuda,cudnn]>=1.30.0,<2; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'",
]

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.16.7,<1", "sounddevice>=0.5.6,<1", "soundfile>=0.14.0,<1"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
required-version = ">=0.16.0"
output-format = "concise"
show-fixes = true

[tool.ruff.lint]
# ruff >=0.16 enables a much wider default rule set; keep the previous
# selection (ruff's pre-0.16 default + isort/pyupgrade) so vendored code
# in trim.py stays untouched
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
