name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]
        python: ["3.14"]
        include:
          - platform: macos-14
            python: "3.14"
          - platform: ubuntu-22.04-arm
            python: "3.14"
          - platform: windows-2022
            python: "3.14"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Download integration fixtures
        run: |
          curl --fail --location --retry 3 --output kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl --fail --location --retry 3 --output voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
        shell: bash

      - name: Inference and streaming tests
        env:
          KOKORO_TEST_MODEL: kokoro-v1.0.onnx
          KOKORO_TEST_VOICES: voices-v1.0.bin
        run: uv run --locked python -m unittest discover -s tests -p test_integration.py -v

      - name: Build distributions
        run: uv build

  voice-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Test voice conversion
        run: uv run --with "torch>=2.14.0,<3" --with requests --with tqdm python -m unittest discover -s tests -p test_fetch_voices.py -v
